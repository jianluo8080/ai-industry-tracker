<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 产业追踪">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='30' fill='%231e293b'/%3E%3Ctext x='96' y='128' font-size='100' text-anchor='middle' fill='%233b82f6' font-family='Arial' font-weight='bold'%3EAI%3C/text%3E%3C/svg%3E">
  <title>全球 AI 产业跟踪框架 - 时间序列趋势仪表盘</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>AI 产业追踪</h2>
        <p>时间序列趋势仪表盘</p>
        <p class="update-date">更新: 2026-07-30</p>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer" id="sidebarFooter"></div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent"></main>
  </div>

  <!-- 数据录入弹窗 -->
  <div class="modal-overlay" id="dataModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">添加数据点</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-subtitle" id="modalSubtitle"></p>
        <input type="hidden" id="modalMetricId">
        <div class="form-group">
          <label>日期/期间</label>
          <input type="text" id="dataDate" placeholder="如 2026-Q3 或 2026-08">
        </div>
        <div class="form-group">
          <label>显示标签 (可选)</label>
          <input type="text" id="dataLabel" placeholder="如 2026 Q3 (备注信息)">
        </div>
        <div class="form-group">
          <label>数值</label>
          <input type="number" id="dataValue" step="any" placeholder="输入数值">
        </div>
        <div class="form-group">
          <label>来源 (可选)</label>
          <input type="text" id="dataSource" placeholder="数据来源">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveDataPoint()">保存</button>
      </div>
    </div>
  </div>

  <script src="data-model.js?v=7"></script>
  <script src="app.js?v=7"></script>
  <script>
    // PWA Service Worker 注册
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js?v=7').then(function(reg) {
          console.log('SW registered:', reg.scope);
        }).catch(function(err) {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
